<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espelho Mágico</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7C5CFF;
    --accent-light: #A78BFA;
    --dark: #0A0C10;
    --dark-2: #12141B;
    --dark-3: #1A1D27;
    --border: rgba(124,92,255,0.22);
    --border-light: rgba(255,255,255,0.06);
    --text: #E8EAF0;
    --text-muted: #7A8094;
    --danger: #FF6B6B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(124,92,255,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
    z-index: 1;
  }

  .label {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-light);
    font-weight: 700;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 9vw, 3rem);
    letter-spacing: 0.04em;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 30px rgba(124,92,255,0.35);
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    max-width: 340px;
  }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--dark-2);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(124,92,255,0.12);
  }

  video, canvas, img.shot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* efeito espelho real */
  }

  img.shot { transform: scaleX(-1); }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10,12,16,0.55);
    text-align: center;
    padding: 20px;
  }

  .countdown-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 6rem;
    color: #fff;
    text-shadow: 0 0 30px rgba(124,92,255,0.7);
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }

  .flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .flash.on {
    animation: flash-pop 0.35s ease;
  }

  @keyframes flash-pop {
    0% { opacity: 0.95; }
    100% { opacity: 0; }
  }

  .hint {
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 13px 26px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    color: #fff;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(124,92,255,0.35);
  }

  .btn:active { transform: scale(0.97); }

  .btn.secondary {
    background: var(--dark-3);
    border: 1px solid var(--border-light);
    box-shadow: none;
  }

  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .result-caption {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.03em;
    color: var(--accent-light);
  }

  footer {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .error-box {
    font-size: 0.85rem;
    color: var(--danger);
    max-width: 320px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="label">Espelho Mágico</div>
  <div class="title">Olhe pro espelho...</div>
  <div class="subtitle" id="subtitle">Toque em "Começar" e fique parado — o espelho vai te mostrar sozinho.</div>

  <div class="frame" id="frame">
    <video id="video" autoplay playsinline muted></video>
    <img id="shot" class="shot" style="display:none;">
    <div class="flash" id="flash"></div>

    <div class="overlay" id="start-overlay">
      <button class="btn" id="start-btn">✨ Começar</button>
      <div class="hint">Precisa liberar o acesso à câmera frontal</div>
    </div>
  </div>

  <div class="actions" id="result-actions" style="display:none;">
    <div class="result-caption" id="result-caption"></div>
  </div>

  <div class="actions" id="post-actions" style="display:none;">
    <button class="btn secondary" id="retry-btn">🔄 De novo</button>
    <button class="btn" id="download-btn">⬇️ Salvar foto</button>
  </div>

  <footer>Tudo acontece no seu celular — nada é enviado a lugar nenhum</footer>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
const frame         = document.getElementById('frame');
const video          = document.getElementById('video');
const shotImg        = document.getElementById('shot');
const canvas         = document.getElementById('canvas');
const flash          = document.getElementById('flash');
const startOverlay   = document.getElementById('start-overlay');
const startBtn       = document.getElementById('start-btn');
const subtitle       = document.getElementById('subtitle');
const resultActions  = document.getElementById('result-actions');
const resultCaption  = document.getElementById('result-caption');
const postActions    = document.getElementById('post-actions');
const retryBtn       = document.getElementById('retry-btn');
const downloadBtn    = document.getElementById('download-btn');

const captions = [
  "Rá! Peguei você 😄",
  "Sorriso capturado ✨",
  "O espelho não mente 🪞",
  "Essa foi boa!",
  "Direto do espelho mágico 🔮"
];

let stream = null;

async function startMirror() {
  startBtn.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    startOverlay.style.display = 'none';
    subtitle.textContent = 'Fique parado, olhando pro espelho...';
    runCountdown();
  } catch (err) {
    subtitle.innerHTML = '';
    startOverlay.innerHTML = `<div class="error-box">Não consegui acessar a câmera frontal. Verifique a permissão de câmera do navegador e tente novamente.</div>
      <button class="btn" id="retry-perm-btn">Tentar de novo</button>`;
    document.getElementById('retry-perm-btn').addEventListener('click', () => location.reload());
  }
}

function runCountdown() {
  let n = 3;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'countdown-overlay';
  frame.appendChild(overlay);

  const tick = () => {
    if (n === 0) {
      overlay.remove();
      takeShot();
      return;
    }
    overlay.innerHTML = `<div class="countdown-num">${n}</div>`;
    n--;
    setTimeout(tick, 800);
  };
  tick();
}

function takeShot() {
  const w = video.videoWidth || 720;
  const h = video.videoHeight || 960;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  // desenha espelhado, igual ao preview
  ctx.translate(w, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);

  const dataUrl = canvas.toDataURL('image/png');
  shotImg.src = dataUrl;
  shotImg.style.display = 'block';
  video.style.display = 'none';

  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 400);

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  subtitle.textContent = 'Foto tirada pelo espelho mágico!';
  resultCaption.textContent = captions[Math.floor(Math.random() * captions.length)];
  resultActions.style.display = 'flex';
  postActions.style.display = 'flex';

  downloadBtn.onclick = () => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'espelho-magico.png';
    a.click();
  };
}

retryBtn.addEventListener('click', () => {
  shotImg.style.display = 'none';
  video.style.display = 'block';
  resultActions.style.display = 'none';
  postActions.style.display = 'none';
  subtitle.textContent = 'Toque em "Começar" e fique parado — o espelho vai te mostrar sozinho.';
  startOverlay.style.display = 'flex';
  startOverlay.innerHTML = `<button class="btn" id="start-btn">✨ Começar</button><div class="hint">Precisa liberar o acesso à câmera frontal</div>`;
  document.getElementById('start-btn').addEventListener('click', startMirror);
});

startBtn.addEventListener('click', startMirror);
</script>
</body>
</html>
