<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem Regressiva — Ano Novo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #7C5CFF;
    --accent-light: #A78BFA;
    --dark: #0A0C10;
    --dark-2: #12141B;
    --dark-3: #1A1D27;
    --border: rgba(124,92,255,0.22);
    --border-light: rgba(255,255,255,0.06);
    --text: #E8EAF0;
    --text-muted: #7A8094;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(124,92,255,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  .wrap {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    text-align: center;
    z-index: 1;
  }

  /* ── CLOCK ── */
  .clock-label {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }

  .clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: 0.04em;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 30px rgba(124,92,255,0.35);
  }

  .date-line {
    font-size: 0.95rem;
    color: var(--text-muted);
    text-transform: capitalize;
    margin-top: 4px;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* ── COUNTDOWN ── */
  .countdown-title {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-light);
    font-weight: 700;
  }

  .countdown-year {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    letter-spacing: 0.06em;
    color: #fff;
    margin-top: 2px;
  }

  .countdown-year span { color: var(--accent-light); }

  .units {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
    margin-top: 8px;
  }

  .unit {
    background: var(--dark-2);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 20px 8px;
    transition: border-color 0.3s, transform 0.2s;
  }

  .unit:hover {
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .unit-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 3.2rem);
    color: #fff;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .unit-label {
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 6px;
  }

  .progress-wrap {
    width: 100%;
    margin-top: 4px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    border-radius: 4px;
    background: var(--dark-3);
    overflow: hidden;
    border: 1px solid var(--border-light);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s ease;
  }

  .progress-caption {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .progress-caption strong { color: var(--accent-light); }

  /* ── CELEBRATION ── */
  .celebration {
    display: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 10vw, 4rem);
    color: var(--accent-light);
    letter-spacing: 0.05em;
    animation: pulse-glow 1.4s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 20px rgba(124,92,255,0.5); }
    50% { text-shadow: 0 0 45px rgba(124,92,255,0.9); }
  }

  footer {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media (max-width: 480px) {
    .units { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">

  <div>
    <div class="clock-label">Agora</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="date-line" id="date-line">—</div>
  </div>

  <div class="divider"></div>

  <div style="width:100%;">
    <div class="countdown-title">Contagem regressiva para</div>
    <div class="countdown-year" id="target-year">Ano <span>—</span></div>

    <div class="units" id="units">
      <div class="unit">
        <div class="unit-value" id="u-days">00</div>
        <div class="unit-label">Dias</div>
      </div>
      <div class="unit">
        <div class="unit-value" id="u-hours">00</div>
        <div class="unit-label">Horas</div>
      </div>
      <div class="unit">
        <div class="unit-value" id="u-minutes">00</div>
        <div class="unit-label">Minutos</div>
      </div>
      <div class="unit">
        <div class="unit-value" id="u-seconds">00</div>
        <div class="unit-label">Segundos</div>
      </div>
    </div>

    <div class="celebration" id="celebration">🎉 Feliz Ano Novo! 🎉</div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-caption" id="progress-caption">0% do ano concluído</div>
    </div>
  </div>

  <footer>Atualiza a cada segundo · fuso horário do seu dispositivo</footer>

</div>

<script>
const clockEl       = document.getElementById('clock');
const dateLineEl     = document.getElementById('date-line');
const targetYearEl   = document.getElementById('target-year');
const unitsEl        = document.getElementById('units');
const celebrationEl  = document.getElementById('celebration');
const progressFillEl = document.getElementById('progress-fill');
const progressCapEl  = document.getElementById('progress-caption');

const uDays    = document.getElementById('u-days');
const uHours   = document.getElementById('u-hours');
const uMinutes = document.getElementById('u-minutes');
const uSeconds = document.getElementById('u-seconds');

const dateFmt = new Intl.DateTimeFormat('pt-BR', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});

function pad(n) {
  return String(n).padStart(2, '0');
}

function getTargets(now) {
  const currentYear = now.getFullYear();
  const yearStart = new Date(currentYear, 0, 1, 0, 0, 0, 0);
  const nextYear = new Date(currentYear + 1, 0, 1, 0, 0, 0, 0);
  return { yearStart, nextYear, targetYearNumber: currentYear + 1 };
}

function tick() {
  const now = new Date();

  // relógio
  clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  dateLineEl.textContent = dateFmt.format(now);

  const { yearStart, nextYear, targetYearNumber } = getTargets(now);
  targetYearEl.innerHTML = `Ano <span>${targetYearNumber}</span>`;

  const diff = nextYear - now;

  if (diff <= 0) {
    unitsEl.style.display = 'none';
    celebrationEl.style.display = 'block';
    progressFillEl.style.width = '100%';
    progressCapEl.innerHTML = `<strong>100%</strong> do ano concluído`;
    return;
  }

  unitsEl.style.display = 'grid';
  celebrationEl.style.display = 'none';

  const totalSeconds = Math.floor(diff / 1000);
  const days    = Math.floor(totalSeconds / 86400);
  const hours   = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  uDays.textContent    = pad(days);
  uHours.textContent   = pad(hours);
  uMinutes.textContent = pad(minutes);
  uSeconds.textContent = pad(seconds);

  // progresso do ano atual
  const yearTotal   = nextYear - yearStart;
  const yearElapsed = now - yearStart;
  const pct = Math.max(0, Math.min(100, (yearElapsed / yearTotal) * 100));
  progressFillEl.style.width = pct.toFixed(3) + '%';
  progressCapEl.innerHTML = `<strong>${pct.toFixed(1)}%</strong> do ano concluído`;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
